name: Django CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # =========================================================
  # TEST JOB
  # =========================================================
  test:
    name: Django Test
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1

    defaults:
      run:
        working-directory: my_ecom

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run Django tests
        run: |
          python manage.py test


  # =========================================================
  # DEPLOY TO CPANEL
  # =========================================================
  deploy:
    name: Deploy to cPanel
    needs: test

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: cloud.webfastdns.com
      DEPLOY_USER: manirsho
      DEPLOY_PORT: "22"
      DEPLOY_DIR: /home/manirsho/Django-Shoppingo-Ecom
      DEPLOY_VENV: /home/manirsho/virtualenv/Django-Shoppingo-Ecom/my_ecom/3.13

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write deploy marker
        run: |
          echo "${{ github.sha }}" > .deploy-sha
          echo "${{ github.event.head_commit.message }}" | head -1 > .deploy-message

      - name: Prepare SSH key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "DEPLOY_KEY secret is empty."
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" | sed 's/\r$//' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          if ! grep -q "BEGIN.*PRIVATE KEY" "$HOME/.ssh/deploy_key"; then
            echo "DEPLOY_KEY is invalid."
            exit 1
          fi

      - name: Load SSH key into agent
        env:
          SSH_PASSPHRASE: ${{ secrets.DEPLOY_PASSPHRASE }}
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          echo "$SSH_PASSPHRASE" | ssh-add "$HOME/.ssh/deploy_key"

      - name: Pack and upload code (tar + scp, no rsync on server)
        env:
          SSH_PASSPHRASE: ${{ secrets.DEPLOY_PASSPHRASE }}
        run: |
          set -e
          eval "$(ssh-agent -s)"
          echo "$SSH_PASSPHRASE" | ssh-add "$HOME/.ssh/deploy_key"
          tar czf /tmp/deploy.tgz \
            --exclude='./.git' \
            --exclude='./venv' \
            --exclude='./my_ecom/media' \
            --exclude='./my_ecom/staticfiles' \
            --exclude='./.cursor' \
            -C "$GITHUB_WORKSPACE" .
          scp -P "${DEPLOY_PORT}" -o StrictHostKeyChecking=accept-new \
            /tmp/deploy.tgz "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/deploy.tgz"

      - name: Extract on server, run Django, restart Passenger
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          port: ${{ env.DEPLOY_PORT }}
          key_path: /home/runner/.ssh/deploy_key
          passphrase: ${{ secrets.DEPLOY_PASSPHRASE }}
          script: |
            set -e
            cd "${{ env.DEPLOY_DIR }}"
            tar xzf /tmp/deploy.tgz
            rm -f /tmp/deploy.tgz
            echo "Deploy marker on server:"
            cat .deploy-sha || true
            cat .deploy-message || true

            source "${{ env.DEPLOY_VENV }}/bin/activate"
            cd my_ecom

            python -m pip install --upgrade pip
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            python manage.py check

            mkdir -p tmp
            touch tmp/restart.txt
            echo "Deployment completed."
