name: Django CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # =========================================================
  # TEST JOB
  # =========================================================
  test:
    name: Django Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: my_ecom

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run Django tests
        run: |
          python manage.py test


  # =========================================================
  # DEPLOY TO CPANEL
  # =========================================================
  deploy:
    name: Deploy to cPanel
    needs: test

    # Deploy only after a push to main.
    # Pull requests will NOT deploy.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to cPanel via SSH
        uses: appleboy/ssh-action@v1.2.5

        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}

          key: ${{ secrets.DEPLOY_KEY }}

          # Use this only if your SSH private key has a passphrase
          passphrase: ${{ secrets.DEPLOY_PASSPHRASE }}

          script_stop: true

          script: |

            echo "======================================"
            echo "Starting ManirShop deployment"
            echo "======================================"

            # -------------------------------------------
            # Go to Git repository
            # -------------------------------------------
            cd "${{ secrets.DEPLOY_DIR }}"

            echo "Project directory:"
            pwd

            # -------------------------------------------
            # Get latest code from GitHub
            # -------------------------------------------
            echo "Fetching latest code..."

            git fetch origin main

            echo "Resetting server to GitHub main..."

            git reset --hard origin/main

            # -------------------------------------------
            # Activate cPanel Python 3.13 environment
            # -------------------------------------------
            echo "Activating Python 3.13..."

            source "${{ secrets.DEPLOY_VENV }}/bin/activate"

            echo "Python version:"
            python --version

            echo "Python path:"
            which python

            # -------------------------------------------
            # Django project
            # -------------------------------------------
            cd my_ecom

            echo "Django project directory:"
            pwd

            # -------------------------------------------
            # Install requirements
            # -------------------------------------------
            echo "Installing dependencies..."

            python -m pip install --upgrade pip

            pip install -r requirements.txt

            # -------------------------------------------
            # Django migrations
            # -------------------------------------------
            echo "Running migrations..."

            python manage.py migrate --noinput

            # -------------------------------------------
            # Collect static files
            # -------------------------------------------
            echo "Collecting static files..."

            python manage.py collectstatic --noinput

            # -------------------------------------------
            # Restart cPanel Passenger
            # -------------------------------------------
            echo "Restarting Passenger..."

            mkdir -p tmp

            touch tmp/restart.txt

            echo "======================================"
            echo "Deployment completed successfully!"
            echo "======================================"
