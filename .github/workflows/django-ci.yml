name: Django CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # =========================================================
  # TEST JOB
  # =========================================================
  test:
    name: Django Test
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1

    defaults:
      run:
        working-directory: my_ecom

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run Django tests
        run: |
          python manage.py test


  # =========================================================
  # DEPLOY TO CPANEL
  # =========================================================
  deploy:
    name: Deploy to cPanel
    needs: test

    # Deploy only after a push to main.
    # Pull requests will NOT deploy.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: cloud.webfastdns.com
      DEPLOY_USER: manirsho
      DEPLOY_PORT: "22"
      DEPLOY_DIR: /home/manirsho/Django-Shoppingo-Ecom
      DEPLOY_VENV: /home/manirsho/virtualenv/Django-Shoppingo-Ecom/my_ecom/3.13

    steps:

      - name: Prepare SSH key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "DEPLOY_KEY secret is empty. Add your private key in GitHub → Settings → Secrets."
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" | sed 's/\r$//' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          if ! grep -q "BEGIN.*PRIVATE KEY" "$HOME/.ssh/deploy_key"; then
            echo "DEPLOY_KEY is invalid. Paste the full key including BEGIN/END lines."
            exit 1
          fi
          echo "SSH key prepared ($(wc -c < "$HOME/.ssh/deploy_key") bytes)"

      - name: Deploy to cPanel via SSH
        uses: appleboy/ssh-action@v1.2.5

        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          port: ${{ env.DEPLOY_PORT }}

          key_path: /home/runner/.ssh/deploy_key

          # Required because github-deploy-ecom key is passphrase-protected
          passphrase: ${{ secrets.DEPLOY_PASSPHRASE }}

          script: |

            echo "======================================"
            echo "Starting ManirShop deployment"
            echo "======================================"

            cd "${{ env.DEPLOY_DIR }}"

            echo "Project directory:"
            pwd

            echo "Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Activating Python 3.13..."
            source "${{ env.DEPLOY_VENV }}/bin/activate"

            python --version
            which python

            cd my_ecom

            echo "Django project directory:"
            pwd

            python -m pip install --upgrade pip
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            python manage.py check

            mkdir -p tmp
            touch tmp/restart.txt

            echo "======================================"
            echo "Deployment completed successfully!"
            echo "======================================"
