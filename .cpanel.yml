---
# cPanel Git Version Control — runs when you click "Deploy HEAD Commit"
# Adjust VENV path if your Python app lives elsewhere (cPanel → Setup Python App).
deployment:
  tasks:
    - cd my_ecom
    - pip install -r requirements.txt
    - python manage.py migrate --noinput
    - python manage.py collectstatic --noinput
    - /bin/touch ../tmp/restart.txt 2>/dev/null || true
